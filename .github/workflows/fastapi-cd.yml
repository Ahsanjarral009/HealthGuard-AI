name: Deploy FastAPI Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - 'Dockerfile'
      - '.github/workflows/fastapi-cd.yml'
        

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'Backend/requirements.txt'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev

    - name: Install dependencies
      run: |
        cd Backend
        pip install -r requirements.txt

    - name: Validate FastAPI app
      run: |
        cd Backend
        python -c "from fastapi_app import app; print('✅ Import Success')"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t cosmicahsan/healthguard-ai:latest .

    - name: Push Docker image
      run: |
        docker push cosmicahsan/healthguard-ai:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy Docker container to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        timeout: 300s
        script: |
          set -e

          APP_NAME="healthguard-prod"
          IMAGE="cosmicahsan/healthguard-ai:latest"

          echo "🚀 Pulling latest image..."
          sudo docker pull $IMAGE

          echo "🛑 Removing old container..."
          sudo docker rm -f $APP_NAME || true

          echo "▶ Starting new container..."
          sudo docker run -d \
            --name $APP_NAME \
            -p 80:8000 \
            --restart always \
            $IMAGE

          echo "⏳ Waiting..."
          sleep 5

          echo "🏥 Health check..."
          curl -f http://localhost:8000/ || (
            sudo docker logs $APP_NAME | tail -n 50
            exit 1
          )
