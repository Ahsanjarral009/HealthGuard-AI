name: Deploy FastAPI Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'Backend/requirements.txt'
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev
    
    - name: Install dependencies
      run: |
        cd Backend
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd Backend
        if [ -d "tests" ]; then
          python -m pytest tests/ -v
        else
          echo "No tests directory found"
        fi
    
    - name: Validate FastAPI app
      run: |
        cd Backend
        python -c "
        try:
            from fastapi_app import app
            print('✅ FastAPI app can be imported successfully')
        except Exception as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        timeout: 300s
        script: |
          set -e
          
          DEPLOY_USER=ubuntu
          APP_DIR="/var/www/fastapi-app"
          BACKUP_DIR="/var/www/backups"
          
          echo "================================================"
          echo "🚀 Starting FastAPI Deployment"
          echo "================================================"
          
          # 1. Install System Drivers
          echo "📦 Step 1: Checking system dependencies..."
          if ! dpkg -s unixodbc-dev >/dev/null 2>&1; then
              echo "🔧 Installing ODBC drivers..."
              sudo apt-get update
              sudo apt-get install -y unixodbc-dev
          else
              echo "✅ ODBC drivers already installed"
          fi
          
          # 2. Fix Permissions & Clean Broken State
          echo ""
          echo "🧹 Step 2: Cleaning up old deployments..."
          sudo mkdir -p "$BACKUP_DIR"
          
          # Clean nested/broken folders from previous runs
          if [ -d "$APP_DIR/HealthGuard-AI" ]; then 
              echo "⚠️  Found nested HealthGuard-AI directory, cleaning..."
              sudo rm -rf "$APP_DIR"
          fi
          
          if [ -d "$APP_DIR" ] && [ ! -d "$APP_DIR/.git" ]; then 
              echo "⚠️  Found corrupted app directory, cleaning..."
              sudo rm -rf "$APP_DIR"
          fi
          
          sudo mkdir -p "$APP_DIR"
          sudo chown -R $DEPLOY_USER:$DEPLOY_USER "$APP_DIR"
          sudo chown -R $DEPLOY_USER:$DEPLOY_USER "$BACKUP_DIR"
          
          cd "$APP_DIR"
          
          # 3. Clone or Pull Latest Code
          echo ""
          echo "📥 Step 3: Fetching latest code..."
          git config --global --add safe.directory "$APP_DIR"
          
          if [ ! -d ".git" ]; then
            echo "📥 Cloning repository..."
            git clone https://github.com/Ahsanjarral009/HealthGuard-AI.git .
          else
            echo "🔄 Repository exists, pulling latest changes..."
          fi
          
          git fetch origin
          git reset --hard origin/main
          echo "✅ Code updated to latest commit: $(git rev-parse --short HEAD)"
          
          # 4. Setup Python Environment
          echo ""
          echo "🐍 Step 4: Setting up Python environment..."
          if [ ! -d "venv" ]; then 
              echo "Creating new virtual environment..."
              python3 -m venv venv
          else
              echo "✅ Virtual environment exists"
          fi
          
          source venv/bin/activate
          pip install --upgrade pip --quiet
          pip install -r Backend/requirements.txt --quiet
          echo "✅ Python dependencies installed"
          
          # 5. Setup Environment File
          echo ""
          echo "⚙️  Step 5: Configuring environment..."
          if [ -f ".env.example" ]; then
            echo "🔧 Setting up .env file..."
            cp .env.example .env
            cp .env.example Backend/.env
            echo "✅ Environment files created"
          elif [ ! -f "Backend/.env" ]; then
            echo "⚠️  WARNING: No .env.example found and no existing .env file!"
            echo "Creating minimal .env file..."
            cat > Backend/.env << 'ENVEOF'
# Minimal configuration - UPDATE THESE VALUES
DATABASE_URL=sqlite:///./test.db
SECRET_KEY=your-secret-key-here-change-this
ALGORITHM=HS256
ACCESS_TOKEN_EXPIRE_MINUTES=30
ENVEOF
            echo "⚠️  Please update Backend/.env with actual values!"
          else
            echo "✅ Using existing .env file"
          fi
          
          # 6. Dry Run Diagnostic
          echo ""
          echo "🕵️  Step 6: Running diagnostic test..."
          cd "$APP_DIR/Backend"
          export PYTHONPATH=$APP_DIR/Backend
          
          # Create diagnostic script
          cat > diag.py << 'DIAGEOF'
import sys
import os
try:
    from fastapi_app import app
    print('✅ SUCCESS: App imported successfully!')
    print(f'   App title: {app.title if hasattr(app, "title") else "N/A"}')
except Exception as e:
    print(f'❌ CRITICAL ERROR: {e}')
    import traceback
    traceback.print_exc()
    sys.exit(1)
DIAGEOF
          
          python3 diag.py
          DIAG_RESULT=$?
          rm diag.py
          
          if [ $DIAG_RESULT -ne 0 ]; then
              echo "❌ Diagnostic test failed! Aborting deployment."
              exit 1
          fi
          
          echo "✅ Diagnostic test passed"
          
          # 7. Stop Existing Service and Free Port
          echo ""
          echo "🛑 Step 7: Stopping existing service..."
          if sudo systemctl is-active --quiet fastapi.service; then
              echo "Stopping fastapi.service..."
              sudo systemctl stop fastapi.service
              sleep 3
          fi
          
          # Kill any process still using port 8000
          if sudo lsof -i :8000 >/dev/null 2>&1; then
              echo "⚠️  Port 8000 is still in use, forcing cleanup..."
              sudo fuser -k 8000/tcp || true
              sleep 2
          fi
          
          echo "✅ Port 8000 is free"
          
          # 8. Create Systemd Service
          echo ""
          echo "🔧 Step 8: Creating systemd service..."
          
          sudo cat > /etc/systemd/system/fastapi.service << 'SERVICEEOF'
[Unit]
Description=FastAPI HealthGuard Application
After=network.target

[Service]
Type=simple
User=ubuntu
Group=www-data
WorkingDirectory=/var/www/fastapi-app/Backend
Environment="PATH=/var/www/fastapi-app/venv/bin"
Environment="PYTHONPATH=/var/www/fastapi-app/Backend"
EnvironmentFile=/var/www/fastapi-app/Backend/.env
ExecStart=/var/www/fastapi-app/venv/bin/uvicorn fastapi_app:app --host 0.0.0.0 --port 8000 --workers 1
Restart=always
RestartSec=5
StandardOutput=journal
StandardError=journal
SyslogIdentifier=fastapi

[Install]
WantedBy=multi-user.target
SERVICEEOF
          
          echo "✅ Service file created"
          
          # 9. Start Service
          echo ""
          echo "🚀 Step 9: Starting FastAPI service..."
          sudo systemctl daemon-reload
          sudo systemctl enable fastapi.service
          sudo systemctl start fastapi.service
          
          # Wait for service to start
          echo "⏳ Waiting for service to initialize..."
          sleep 8
          
          # 10. Verify Deployment
          echo ""
          echo "🔍 Step 10: Verifying deployment..."
          echo ""
          echo "📄 Service File Content:"
          echo "----------------------------------------"
          cat /etc/systemd/system/fastapi.service
          echo "----------------------------------------"
          echo ""
          
          echo "📊 Service Status:"
          echo "----------------------------------------"
          sudo systemctl status fastapi.service --no-pager -l || true
          echo "----------------------------------------"
          echo ""
          
          echo "📋 Last 30 Log Lines:"
          echo "----------------------------------------"
          sudo journalctl -u fastapi.service -n 30 --no-pager
          echo "----------------------------------------"
          echo ""
          
          # Health check
          echo "🏥 Running health check..."
          MAX_RETRIES=5
          RETRY_COUNT=0
          HEALTH_CHECK_PASSED=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f -s http://localhost:8000/health > /dev/null 2>&1; then
                  HEALTH_CHECK_PASSED=true
                  break
              else
                  RETRY_COUNT=$((RETRY_COUNT + 1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                      echo "⏳ Health check attempt $RETRY_COUNT/$MAX_RETRIES failed, retrying in 3s..."
                      sleep 3
                  fi
              fi
          done
          
          if [ "$HEALTH_CHECK_PASSED" = true ]; then
              echo ""
              echo "================================================"
              echo "✅ DEPLOYMENT SUCCESSFUL!"
              echo "================================================"
              echo "🌐 API is running at: http://localhost:8000"
              echo "📚 Docs available at: http://localhost:8000/docs"
              echo "================================================"
              exit 0
          else
              echo ""
              echo "================================================"
              echo "❌ DEPLOYMENT FAILED - Health Check Failed"
              echo "================================================"
              echo ""
              echo "🔍 Full Diagnostic Information:"
              echo "----------------------------------------"
              
              echo ""
              echo "1️⃣  Service Status:"
              sudo systemctl status fastapi.service --no-pager -l || true
              
              echo ""
              echo "2️⃣  Last 100 Log Lines:"
              sudo journalctl -u fastapi.service -n 100 --no-pager
              
              echo ""
              echo "3️⃣  Port 8000 Status:"
              sudo lsof -i :8000 || echo "No process listening on port 8000"
              
              echo ""
              echo "4️⃣  Environment File:"
              if [ -f /var/www/fastapi-app/Backend/.env ]; then
                  echo "✅ .env file exists"
                  echo "File size: $(wc -c < /var/www/fastapi-app/Backend/.env) bytes"
              else
                  echo "❌ .env file NOT found!"
              fi
              
              echo ""
              echo "5️⃣  Python Path Check:"
              /var/www/fastapi-app/venv/bin/python3 -c "import sys; print('\n'.join(sys.path))"
              
              echo ""
              echo "================================================"
              exit 1
          fi

    - name: Send deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "================================================"
          echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY!"
          echo "================================================"
        else
          echo "================================================"
          echo "❌ DEPLOYMENT FAILED!"
          echo "================================================"
          echo "Check the logs above for details"
        fi
