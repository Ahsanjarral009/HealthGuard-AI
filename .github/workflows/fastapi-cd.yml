name: Test Trigger

on:
  push:
    branches: [ main ]
    # Remove path restrictions initially
    # paths:
    #   - 'Backend FastApi/Smart_Disease_Prediction_System/**'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug file structure
        run: |
          echo "Current directory structure:"
          find . -type d | sort
          echo ""
          echo "Checking backend path:"
          if [ -d "Backend FastApi/Smart_Disease_Prediction_System" ]; then
            echo "✅ Backend directory exists"
            ls -la "Backend FastApi/Smart_Disease_Prediction_System/"
          else
            echo "❌ Backend directory NOT found"
            # Try different variations
            echo "Looking for similar directories:"
            find . -type d -name "*Backend*" -o -name "*FastApi*" -o -name "*Smart*" | head -20
          fi
