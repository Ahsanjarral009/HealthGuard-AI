name: Deploy FastAPI Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/fastapi-cd.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'Backend/requirements.txt'
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev
    
    - name: Install dependencies
      run: |
        cd Backend
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd Backend
        if [ -d "tests" ]; then
          python -m pytest tests/ -v
        else
          echo "No tests directory found"
        fi
    
    - name: Validate FastAPI app
      run: |
        cd Backend
        python -c "
        try:
            from fastapi_app import app
            print('✅ FastAPI app can be imported successfully')
        except Exception as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        timeout: 300s
        script: |
        set -e
DEPLOY_USER=ubuntu
APP_DIR="/var/www/fastapi-app"
BACKUP_DIR="/var/www/backups"

# 1. Install System Drivers
if ! dpkg -s unixodbc-dev >/dev/null 2>&1; then
    echo "🔧 Installing ODBC drivers..."
    sudo apt-get update
    sudo apt-get install -y unixodbc-dev gcc g++ python3-dev
fi

# 2. Fix Permissions & Clean Broken State
sudo mkdir -p "$BACKUP_DIR"

# Clean nested/broken folders from previous runs
if [ -d "$APP_DIR/HealthGuard-AI" ]; then sudo rm -rf "$APP_DIR"; fi
if [ -d "$APP_DIR" ] && [ ! -d "$APP_DIR/.git" ]; then sudo rm -rf "$APP_DIR"; fi

sudo mkdir -p "$APP_DIR"
sudo chown -R $DEPLOY_USER:$DEPLOY_USER "$APP_DIR"
sudo chown -R $DEPLOY_USER:$DEPLOY_USER "$BACKUP_DIR"

cd "$APP_DIR"

# 3. Clone or Pull
git config --global --add safe.directory "$APP_DIR"

if [ ! -d ".git" ]; then
  echo "📥 Cloning repository..."
  git clone https://github.com/Ahsanjarral009/HealthGuard-AI.git .
else
  echo "📥 Pulling latest changes..."
  git fetch origin
  git reset --hard origin/main
fi

# 4. Setup Python Environment
if [ ! -d "venv" ]; then 
    echo "🐍 Creating Python virtual environment..."
    python3 -m venv venv
fi

source venv/bin/activate
pip install --upgrade pip setuptools wheel

echo "📦 Installing dependencies..."
pip install -r Backend/requirements.txt

# 5. Setup .env file
echo "🔧 Setting up environment variables..."
if [ -f ".env.example" ]; then
  cp .env.example Backend/.env
  # Also copy to root for backup
  cp .env.example .env
fi

# 6. Test Import with Full Environment
echo "🕵️ Testing app import with environment..."
cd "$APP_DIR/Backend"

# Load environment variables for testing
if [ -f ".env" ]; then
    set -a
    source .env
    set +a
fi

# Create comprehensive test script
cat > test_import.py << 'EOF'
import os
import sys
import traceback

print(f"Python PATH: {sys.path}")
print(f"Working directory: {os.getcwd()}")

try:
    # Add current directory to path
    sys.path.insert(0, os.getcwd())
    from fastapi_app import app
    print('✅ SUCCESS: App imported successfully!')
    
    # Test if app has required attributes
    if hasattr(app, 'routes'):
        print(f'✅ App has {len(app.routes)} routes')
    else:
        print('⚠️ Warning: app.routes not found')
        
except Exception as e:
    print(f'❌ CRITICAL ERROR: {e}')
    traceback.print_exc()
    sys.exit(1)
EOF

python3 test_import.py
rm test_import.py

# 7. Create Systemd Service with Environment File
echo "🔧 Creating systemd service..."

# Create environment file for systemd
sudo tee /etc/systemd/system/fastapi.env > /dev/null << EOF
PYTHONPATH=/var/www/fastapi-app/Backend
PATH=/var/www/fastapi-app/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
EOF

# Also copy .env file to systemd accessible location
if [ -f "$APP_DIR/Backend/.env" ]; then
    sudo cp "$APP_DIR/Backend/.env" /etc/systemd/system/fastapi-app.env
    # Load .env variables into systemd environment file
    cat "$APP_DIR/Backend/.env" | sudo tee -a /etc/systemd/system/fastapi.env > /dev/null
fi

# Create the service file
sudo tee /etc/systemd/system/fastapi.service > /dev/null << EOF
[Unit]
Description=FastAPI Application
After=network.target
After=syslog.target

[Service]
User=$DEPLOY_USER
Group=$DEPLOY_USER
WorkingDirectory=$APP_DIR/Backend

# Environment file
EnvironmentFile=/etc/systemd/system/fastapi.env

# Debug environment
Environment=PYTHONUNBUFFERED=1
Environment=PYTHONPATH=$APP_DIR/Backend

# Explicit path to python executable
ExecStart=$APP_DIR/venv/bin/python -m uvicorn fastapi_app:app --host 0.0.0.0 --port 8000 --log-level debug

# Restart configuration
Restart=always
RestartSec=5

# Process management
StandardOutput=journal
StandardError=journal
SyslogIdentifier=fastapi

# Security
NoNewPrivileges=true

[Install]
WantedBy=multi-user.target
EOF

# 8. Reload and Start Service
echo "🔄 Reloading systemd..."
sudo systemctl daemon-reload

echo "🔧 Setting permissions..."
sudo chmod 644 /etc/systemd/system/fastapi.service
sudo chmod 644 /etc/systemd/system/fastapi.env 2>/dev/null || true

echo "🚀 Starting service..."
sudo systemctl enable fastapi.service
sudo systemctl restart fastapi.service

echo "⏳ Waiting for service to start..."
sleep 10

# 9. Check Service Status
echo "📊 Service status:"
sudo systemctl status fastapi.service --no-pager

# 10. Check Logs
echo "📋 Recent logs:"
sudo journalctl -u fastapi.service -n 50 --no-pager

# 11. Health Check with Retry
echo "🏥 Performing health check..."
MAX_RETRIES=5
RETRY_DELAY=5

for i in $(seq 1 $MAX_RETRIES); do
    echo "Attempt $i/$MAX_RETRIES..."
    if curl -f -s http://localhost:8000/health > /dev/null 2>&1; then
        echo "✅ Health check passed!"
        break
    fi
    
    if [ $i -eq $MAX_RETRIES ]; then
        echo "❌ Health check failed after $MAX_RETRIES attempts"
        echo "🔍 Last 100 lines of logs:"
        sudo journalctl -u fastapi.service -n 100 --no-pager
        exit 1
    fi
    
    echo "⏳ Waiting $RETRY_DELAY seconds before retry..."
    sleep $RETRY_DELAY
done

echo "🎉 Deployment completed successfully!"

- name: Send deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi
