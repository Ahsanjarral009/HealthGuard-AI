name: Deploy FastAPI Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/fastapi-cd.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'Backend/requirements.txt'
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev
    
    - name: Install dependencies
      run: |
        cd Backend
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd Backend
        if [ -d "tests" ]; then
          python -m pytest tests/ -v
        else
          echo "No tests directory found"
        fi
    
    - name: Validate FastAPI app
      run: |
        cd Backend
        python -c "
        try:
            from fastapi_app import app
            print('✅ FastAPI app can be imported successfully')
        except Exception as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        timeout: 300s
        script: |
          set -e
          
          DEPLOY_USER=ubuntu
          APP_DIR="/var/www/fastapi-app"
          BACKUP_DIR="/var/www/backups"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SRC_DIR="$APP_DIR/Backend"
          
          # Install drivers if missing
          if ! dpkg -s unixodbc-dev >/dev/null 2>&1; then
              echo "🔧 Installing ODBC drivers on Server..."
              sudo apt-get update
              sudo apt-get install -y unixodbc-dev
          fi
          
          # Create directories
          sudo mkdir -p "$BACKUP_DIR"
          sudo mkdir -p "$APP_DIR"
          
          # -------------------------------------------------------
          # ✅ CRITICAL FIX: Give 'ubuntu' user permission to write
          # -------------------------------------------------------
          echo "🔑 Fixing permissions..."
          sudo chown -R $DEPLOY_USER:$DEPLOY_USER "$APP_DIR"
          sudo chown -R $DEPLOY_USER:$DEPLOY_USER "$BACKUP_DIR"
          
          cd "$APP_DIR"
          
          # Fix for "dubious ownership" error in Git
          git config --global --add safe.directory "$APP_DIR"
          
          if [ ! -d ".git" ]; then
            echo "📥 Cloning repository..."
            git clone https://github.com/Ahsanjarral009/HealthGuard-AI.git .
          fi
          
          echo "🔄 Fetching updates..."
          git fetch origin
          git reset --hard origin/main
          
          # Sync files
          rsync -av --delete \
            --exclude='.env' \
            --exclude='*.db' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            "$SRC_DIR/" "$APP_DIR/"
          
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
          echo "🔧 Creating systemd service..."
          sudo tee /etc/systemd/system/fastapi.service > /dev/null <<EOF
          [Unit]
          Description=FastAPI Application
          After=network.target

          [Service]
          User=$DEPLOY_USER
          Group=www-data
          WorkingDirectory=$APP_DIR
          Environment="PATH=$APP_DIR/venv/bin"
          ExecStart=$APP_DIR/venv/bin/uvicorn fastapi_app:app --host 0.0.0.0 --port 8000
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl restart fastapi.service
          
          sleep 5
          
          sudo systemctl status fastapi.service --no-pager | head -20
          
          if curl -f -s http://localhost:8000/health > /dev/null 2>&1; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            sudo journalctl -u fastapi.service -n 50 --no-pager
            exit 1
          fi

    - name: Send deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi
