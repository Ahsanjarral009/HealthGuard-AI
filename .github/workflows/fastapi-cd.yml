name: Deploy FastAPI Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**' 
      - '.github/workflows/fastapi-cd.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        # FIXED: Path matches your image
        cache-dependency-path: 'Backend/requirements.txt' 
    
    - name: Install dependencies
      run: |
        cd Backend
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd Backend
        if [ -d "tests" ]; then
          python -m pytest tests/ -v
        else
          echo "No tests directory found, skipping..."
        fi
    
    - name: Validate FastAPI app
      run: |
        cd Backend
        python -c "
        try:
            from main import app
            print('✅ FastAPI app can be imported successfully')
        except Exception as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        timeout: 300
        script: |
          set -e
          
          DEPLOY_USER=ubuntu
          APP_DIR="/var/www/fastapi-app"
          BACKUP_DIR="/var/www/backups"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # FIXED: Updated to match your new folder structure
          SRC_DIR="$APP_DIR/Backend" 
          
          sudo mkdir -p "$BACKUP_DIR"
          sudo mkdir -p "$APP_DIR"
          
          cd "$APP_DIR"
          
          # Clone or Fetch
          if [ ! -d ".git" ]; then
            echo "📥 Cloning repository..."
            git clone https://github.com/Ahsanjarral009/HealthGuard-AI.git .
          fi
          
          git fetch origin
          git reset --hard origin/main
          
          echo "📦 Backing up current application..."
          sudo tar -czf "$BACKUP_DIR/app-backup-$TIMESTAMP.tar.gz" \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -C "$APP_DIR" .
          
          echo "📂 Copying backend files to root..."
          # This moves files from Backend/ to the root of the app dir
          rsync -av --delete \
            --exclude='.env' \
            --exclude='*.db' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            "$SRC_DIR/" "$APP_DIR/"
          
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          
          echo "🔧 Setting up virtual environment..."
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
          echo "🔧 Restarting Service..."
          # Assuming service is already created. 
          # If you need to recreate the service file every time, keep your previous EOF block here.
          
          sudo systemctl daemon-reload
          sudo systemctl restart fastapi.service
          
          sleep 5
          
          if curl -f -s http://localhost:8000/health > /dev/null 2>&1; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            sudo journalctl -u fastapi.service -n 50 --no-pager
            exit 1
          fi

    - name: Send deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi
