name: Deploy FastAPI Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/fastapi-cd.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'Backend/requirements.txt'
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev
    
    - name: Install dependencies
      run: |
        cd Backend
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd Backend
        if [ -d "tests" ]; then
          python -m pytest tests/ -v
        else
          echo "No tests directory found"
        fi
    
    - name: Validate FastAPI app
      run: |
        cd Backend
        python -c "
        try:
            from fastapi_app import app
            print('✅ FastAPI app can be imported successfully')
        except Exception as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        timeout: 300s
        script: |
          set -e
          
          DEPLOY_USER=ubuntu
          APP_DIR="/var/www/fastapi-app"
          BACKUP_DIR="/var/www/backups"
          
          # -----------------------------------------------------------
          # 1. Install System Drivers
          # -----------------------------------------------------------
          if ! dpkg -s unixodbc-dev >/dev/null 2>&1; then
              echo "🔧 Installing System Dependencies..."
              sudo apt-get update
              sudo apt-get install -y unixodbc-dev gcc g++ python3-dev
          fi
          
          # -----------------------------------------------------------
          # 2. Fix Permissions & Clean Broken State
          # -----------------------------------------------------------
          sudo mkdir -p "$BACKUP_DIR"
          
          if [ -d "$APP_DIR/HealthGuard-AI" ]; then sudo rm -rf "$APP_DIR"; fi
          if [ -d "$APP_DIR" ] && [ ! -d "$APP_DIR/.git" ]; then sudo rm -rf "$APP_DIR"; fi
          
          sudo mkdir -p "$APP_DIR"
          sudo chown -R $DEPLOY_USER:$DEPLOY_USER "$APP_DIR"
          sudo chown -R $DEPLOY_USER:$DEPLOY_USER "$BACKUP_DIR"
          
          cd "$APP_DIR"
          
          # -----------------------------------------------------------
          # 3. Clone or Pull
          # -----------------------------------------------------------
          git config --global --add safe.directory "$APP_DIR"
          
          if [ ! -d ".git" ]; then
            echo "📥 Cloning repository..."
            git clone https://github.com/Ahsanjarral009/HealthGuard-AI.git .
          else
            echo "📥 Pulling latest changes..."
            git fetch origin
            git reset --hard origin/main
          fi
          
          # -----------------------------------------------------------
          # 4. Setup Python Environment
          # -----------------------------------------------------------
          if [ ! -d "venv" ]; then 
            echo "🐍 Creating Python virtual environment..."
            python3 -m venv venv
          fi
          
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          
          echo "📦 Installing dependencies..."
          pip install -r Backend/requirements.txt
          
          # -----------------------------------------------------------
          # 5. Setup .env file
          # -----------------------------------------------------------
          if [ -f ".env.example" ]; then
            cp .env.example Backend/.env
            cp .env.example .env
          fi
          
          # -------------------------------------------------------------
          # 6. DRY RUN DIAGNOSTIC
          # -------------------------------------------------------------
          echo "🕵️ STARTING DRY RUN DIAGNOSTIC..."
          cd "$APP_DIR/Backend"
          
          # Write diagnostic script safely
          printf "import sys\nimport os\nimport traceback\nprint(f'Python PATH: {sys.path}')\ntry:\n    sys.path.insert(0, os.getcwd())\n    from fastapi_app import app\n    print('✅ SUCCESS: App imported successfully!')\nexcept Exception as e:\n    print(f'❌ CRITICAL ERROR: {e}')\n    traceback.print_exc()\n    sys.exit(1)\n" > diag.py
          
          # Run diagnostic
          $APP_DIR/venv/bin/python3 diag.py
          rm diag.py
          
          echo "   Dry run passed."
          
          # -------------------------------------------------------------
          # 7. Create Systemd Service
          # -------------------------------------------------------------
          echo "🔧 Creating systemd configuration..."
          
          # A. Create Environment File
          sudo printf "PYTHONPATH=$APP_DIR/Backend\nPATH=$APP_DIR/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\n" | sudo tee /etc/systemd/system/fastapi.env > /dev/null
          
          if [ -f "$APP_DIR/Backend/.env" ]; then
             cat "$APP_DIR/Backend/.env" | sudo tee -a /etc/systemd/system/fastapi.env > /dev/null
          fi
          
          # B. Create Service File
          # IMPORTANT: We use $APP_DIR/venv/bin/python3 -m uvicorn to be 100% sure we use the venv
          SERVICE_CONTENT="[Unit]
          Description=FastAPI Application
          After=network.target
          After=syslog.target
          
          [Service]
          User=$DEPLOY_USER
          Group=$DEPLOY_USER
          WorkingDirectory=$APP_DIR/Backend
          EnvironmentFile=/etc/systemd/system/fastapi.env
          Environment=PYTHONUNBUFFERED=1
          Environment=PYTHONPATH=$APP_DIR/Backend
          ExecStart=$APP_DIR/venv/bin/python3 -m uvicorn fastapi_app:app --host 0.0.0.0 --port 8000
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=fastapi
          
          [Install]
          WantedBy=multi-user.target"
          
          echo "$SERVICE_CONTENT" | sudo tee /etc/systemd/system/fastapi.service > /dev/null
          
          # -------------------------------------------------------------
          # 8. Reload and Start
          # -------------------------------------------------------------
          echo "🔄 Reloading systemd..."
          sudo systemctl daemon-reload
          sudo chmod 644 /etc/systemd/system/fastapi.service
          
          echo "🚀 Starting service..."
          sudo systemctl enable fastapi.service
          sudo systemctl restart fastapi.service
          
          echo "⏳ Waiting 10s for service startup..."
          sleep 10
          
          # Check status immediately to catch early crashes
          sudo systemctl status fastapi.service --no-pager
          
          # -------------------------------------------------------------
          # 9. Health Check (FIXED: Simple Loop)
          # -------------------------------------------------------------
          echo "🏥 Performing health check..."
          
          # FIX: We iterate over a simple string list to avoid SSH syntax errors with $(seq)
          for i in 1 2 3 4 5; do
              echo "Attempt $i/5..."
              if curl -f -s http://localhost:8000/health > /dev/null 2>&1; then
                  echo "✅ Health check passed!"
                  exit 0
              fi
              
              if [ "$i" -eq "5" ]; then
                  echo "❌ Health check failed after 5 attempts"
                  echo "🔍 Last 100 lines of logs:"
                  sudo journalctl -u fastapi.service -n 100 --no-pager
                  exit 1
              fi
              
              echo "⏳ Waiting 5 seconds..."
              sleep 5
          done

    - name: Send deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi
