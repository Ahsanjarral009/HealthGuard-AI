name: Deploy FastAPI Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/fastapi-cd.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'Backend/requirements.txt'
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev
    - name: Install dependencies
      run: |
        cd Backend
        pip install -r requirements.txt
    - name: Validate FastAPI app
      run: |
        cd Backend
        python -c "from fastapi_app import app; print('✅ Import Success')"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
    - uses: actions/checkout@v4
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        timeout: 300s
        script: |
          set -e
          DEPLOY_USER=ubuntu
          APP_DIR="/var/www/fastapi-app"
          
          echo "🔧 1. System Prep..."
          sudo apt-get update && sudo apt-get install -y unixodbc-dev gcc g++ python3-dev lsof
          
          echo "📂 2. Directory & Permission Fix..."
          sudo mkdir -p "$APP_DIR"
          sudo chown -R $DEPLOY_USER:$DEPLOY_USER "$APP_DIR"
          
          cd "$APP_DIR"
          git config --global --add safe.directory "$APP_DIR"
          
          if [ ! -d ".git" ]; then
            git clone https://github.com/Ahsanjarral009/HealthGuard-AI.git .
          else
            git fetch origin && git reset --hard origin/main
          fi
          
          echo "🐍 3. Environment Setup..."
          [ ! -d "venv" ] && python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r Backend/requirements.txt
          
          [ -f ".env.example" ] && cp .env.example Backend/.env
          
          echo "🚀 4. Clearing Port 8000 (Prevention)..."
          sudo fuser -k 8000/tcp || true
          
          echo "📜 5. Creating Startup Script..."
          # Using a method that is immune to SSH injection
          cat << 'INNER_EOF' > Backend/start.sh
          #!/bin/bash
          export PYTHONPATH="/var/www/fastapi-app/Backend"
          source "/var/www/fastapi-app/venv/bin/activate"
          exec /var/www/fastapi-app/venv/bin/python3 -m uvicorn fastapi_app:app --host 0.0.0.0 --port 8000 --workers 1
          INNER_EOF
          chmod +x Backend/start.sh
          
          echo "🔧 6. Creating Systemd Service..."
          sudo tee /etc/systemd/system/fastapi.service > /dev/null << 'SERVICE_EOF'
          [Unit]
          Description=FastAPI Backend Service
          After=network.target

          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/var/www/fastapi-app/Backend
          ExecStart=/var/www/fastapi-app/Backend/start.sh
          Restart=always
          RestartSec=3
          StandardOutput=append:/var/www/fastapi-app/backend.log
          StandardError=append:/var/www/fastapi-app/backend.log

          [Install]
          WantedBy=multi-user.target
          SERVICE_EOF

          echo "🔄 7. Service Launch..."
          sudo systemctl daemon-reload
          sudo systemctl enable fastapi.service
          sudo systemctl restart fastapi.service
          
          echo "⏳ 8. Verifying Runtime..."
          sleep 10
          
          echo "🏥 9. Health Check..."
          # We check / first. If you don't have a /health route, the check will still pass on 200 OK.
          if curl -s --head  --request GET http://localhost:8000/ | grep "200 OK" > /dev/null; then
             echo "✅ App is responding on port 8000"
          elif curl -s --head  --request GET http://localhost:8000/health | grep "200 OK" > /dev/null; then
             echo "✅ Health endpoint passed"
          else
             echo "❌ App not responding. Checking internal logs..."
             cat /var/www/fastapi-app/backend.log | tail -n 50
             sudo journalctl -u fastapi.service -n 50 --no-pager
             exit 1
          fi
