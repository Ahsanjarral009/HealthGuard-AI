name: Deploy FastAPI Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/fastapi-cd.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'Backend/requirements.txt'
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev
    
    - name: Install dependencies
      run: |
        cd Backend
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd Backend
        if [ -d "tests" ]; then
          python -m pytest tests/ -v
        else
          echo "No tests directory found"
        fi
    
    - name: Validate FastAPI app
      run: |
        cd Backend
        python -c "
        try:
            from fastapi_app import app
            print('✅ FastAPI app can be imported successfully')
        except Exception as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        timeout: 300s
        script: |
          set -e
          
          DEPLOY_USER=ubuntu
          APP_DIR="/var/www/fastapi-app"
          BACKUP_DIR="/var/www/backups"
          
          # 1. Install System Drivers
          if ! dpkg -s unixodbc-dev >/dev/null 2>&1; then
              echo "🔧 Installing ODBC drivers..."
              sudo apt-get update
              sudo apt-get install -y unixodbc-dev
          fi
          
          # 2. Fix Permissions & Clean Broken State
          sudo mkdir -p "$BACKUP_DIR"
          
          # Clean nested/broken folders from previous runs
          if [ -d "$APP_DIR/HealthGuard-AI" ]; then sudo rm -rf "$APP_DIR"; fi
          if [ -d "$APP_DIR" ] && [ ! -d "$APP_DIR/.git" ]; then sudo rm -rf "$APP_DIR"; fi
          
          sudo mkdir -p "$APP_DIR"
          sudo chown -R $DEPLOY_USER:$DEPLOY_USER "$APP_DIR"
          sudo chown -R $DEPLOY_USER:$DEPLOY_USER "$BACKUP_DIR"
          
          cd "$APP_DIR"
          
          # 3. Clone or Pull
          git config --global --add safe.directory "$APP_DIR"
          
          if [ ! -d ".git" ]; then
            echo "📥 Cloning repository..."
            git clone https://github.com/Ahsanjarral009/HealthGuard-AI.git .
          fi
          
          git fetch origin
          git reset --hard origin/main
          
          # 4. Setup Python Environment
          if [ ! -d "venv" ]; then python3 -m venv venv; fi
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r Backend/requirements.txt
          
          # -------------------------------------------------------------
          # FIX 1: Ensure .env is inside Backend folder
          # -------------------------------------------------------------
          if [ -f ".env.example" ]; then
            echo "🔧 Setting up .env file..."
            cp .env.example .env
            cp .env.example Backend/.env
          fi
          
          # -------------------------------------------------------------
          # FIX 2: DRY RUN (Corruption Proof)
          # We write the script to a file 'diag.py' first, then run it.
          # -------------------------------------------------------------
          echo "🕵️ STARTING DRY RUN DIAGNOSTIC..."
          
          cd "$APP_DIR/Backend"
          export PYTHONPATH=$APP_DIR/Backend
          
          # Create the python script safely
          printf "import sys\nimport os\ntry:\n    from fastapi_app import app\n    print('✅ SUCCESS: App imported successfully!')\nexcept Exception as e:\n    print(f'❌ CRITICAL ERROR: {e}')\n    import traceback\n    traceback.print_exc()\n    sys.exit(1)\n" > diag.py
          
          # Run the script
          python3 diag.py
          
          # Clean up
          rm diag.py
          
          echo "   Dry run passed. Proceeding to Service Start..."
          
          # 5. Create Service (Using printf to prevent corruption)
          echo "🔧 Creating systemd service..."
          
          sudo printf "[Unit]\nDescription=FastAPI Application\nAfter=network.target\n\n[Service]\nUser=$DEPLOY_USER\nGroup=www-data\nWorkingDirectory=$APP_DIR/Backend\nEnvironment=\"PATH=$APP_DIR/venv/bin\"\nExecStart=$APP_DIR/venv/bin/uvicorn fastapi_app:app --host 0.0.0.0 --port 8000\nRestart=always\nRestartSec=5\n\n[Install]\nWantedBy=multi-user.target\n" | sudo tee /etc/systemd/system/fastapi.service > /dev/null
          
          sudo systemctl daemon-reload
          sudo systemctl restart fastapi.service
          
          sleep 5
          
          # Debug: Show file content to confirm it is clean
          echo "📄 Service File Content:"
          cat /etc/systemd/system/fastapi.service
          
          sudo systemctl status fastapi.service --no-pager | head -20
          
          if curl -f -s http://localhost:8000/health > /dev/null 2>&1; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed - Fetching logs..."
            sudo journalctl -u fastapi.service -n 50 --no-pager
            exit 1
          fi

    - name: Send deployment notification
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi
