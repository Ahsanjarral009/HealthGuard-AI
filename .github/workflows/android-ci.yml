name: Android Build & Deploy

on:
  push:
    branches:
      - 'android-deployment'  # This is your specific separate branch
    paths:
      - 'Frontend Android/**' # Only runs if you change Android code

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./Frontend Android"

    steps:
      # 1. Get Code
      - uses: actions/checkout@v4

      # 2. Setup Java (Android SDK is ALREADY installed on ubuntu-latest!)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Build the Unsigned Release APK
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 4. Sign the APK
      - name: Sign APK
        id: sign_app
        uses: ilharp/sign-android-release@v1
        with:
          releaseDir: "Frontend Android/app/build/outputs/apk/release"
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: "34.0.0"  # <--- ADD THIS LINE
     # 5. Upload to S3 (Versioned & Latest)
      - name: Deploy to S3
        # FIX 1: Reset working directory to Root so paths work correctly
        working-directory: .
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BUCKET: ${{ secrets.ANDROID_S3_BUCKET }}
        run: |
          # FIX 2: Use 'signedFile' (ilharp usually uses this output name)
          SIGNED_APK="${{ steps.sign_app.outputs.signedFile }}"
          
          # Debugging: Print the path to be 100% sure
          echo "🔍 Looking for file at: $SIGNED_APK"
          ls -l "$SIGNED_APK"
          
          VERSIONED_NAME="app-${{ github.run_number }}.apk"

          echo "🚀 Uploading Versioned Build (Archive)..."
          aws s3 cp "$SIGNED_APK" "s3://$BUCKET/releases/$VERSIONED_NAME" --acl public-read
          
          echo "🔄 Updating Latest Build (Download Link)..."
          aws s3 cp "$SIGNED_APK" "s3://$BUCKET/latest/app-release.apk" --acl public-read
          
          echo "✅ Deployment Complete"
          echo "History URL: https://$BUCKET.s3.${{ secrets.AWS_REGION }}.amazonaws.com/releases/$VERSIONED_NAME"
          echo "Download URL: https://$BUCKET.s3.${{ secrets.AWS_REGION }}.amazonaws.com/latest/app-release.apk"