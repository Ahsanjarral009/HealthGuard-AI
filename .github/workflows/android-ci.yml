name: Android Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'android-deployment'  
    paths:
      - 'Frontend Android/**' # Only runs if you change Android code

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./Frontend Android"

    steps:
      # 1. Get Code
      - uses: actions/checkout@v4

      # 2. Setup Java (Android SDK is ALREADY installed on ubuntu-latest!)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Build the Unsigned Release APK
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

     # 4. Sign the APK (Updated Action)
      - name: Sign APK
        id: sign_app
        uses: ilharp/sign-android-release@v1  # <--- CHANGED FROM r0adkll
        with:
          releaseDirectory: "Frontend Android/app/build/outputs/apk/release"
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

     # 5. Upload to S3 (Versioned & Latest)
      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BUCKET: ${{ secrets.ANDROID_S3_BUCKET }}
        run: |
          # The signing step outputs the path to the signed APK
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          
          # Create a versioned name (e.g., app-45.apk)
          VERSIONED_NAME="app-${{ github.run_number }}.apk"

          echo "🚀 Uploading Versioned Build (Archive)..."
          # This saves it permanently as app-45.apk
          aws s3 cp "$SIGNED_APK" "s3://$BUCKET/releases/$VERSIONED_NAME" --acl public-read
          
          echo "🔄 Updating Latest Build (Download Link)..."
          # This overwrites app-release.apk so the link always delivers the newest version
          aws s3 cp "$SIGNED_APK" "s3://$BUCKET/latest/app-release.apk" --acl public-read
          
          echo "✅ Deployment Complete"
          echo "History URL: https://$BUCKET.s3.${{ secrets.AWS_REGION }}.amazonaws.com/releases/$VERSIONED_NAME"
          echo "Download URL: https://$BUCKET.s3.${{ secrets.AWS_REGION }}.amazonaws.com/latest/app-release.apk"
